[project]
name = "clawdtv"
version = "0.2.0"
description = "Claude usage limits on a tiny desk display (GeekMagic SmallTV Pro)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pillow>=11.0"]
keywords = ["claude", "claude-code", "usage", "dashboard", "smalltv", "geekmagic"]
classifiers = [
    "Environment :: MacOS X",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]

[project.scripts]
clawdtv = "clawdtv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawdtv"]
